<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartera — Mis clientes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> Cartera</div>

    <div class="nav-label">Resumen</div>
    <div class="stat"><span class="k">Total clientes</span><span class="v" id="statTotal">—</span></div>
    <div class="stat"><span class="k">Recurrentes</span><span class="v" id="statRecurrentes">—</span></div>
    <div class="stat"><span class="k">Ventas cerradas</span><span class="v" id="statVentas">—</span></div>
    <div class="stat"><span class="k">Monto en cartera</span><span class="v" id="statMonto">—</span></div>

    <div class="who">
      <div class="name" id="whoNombre">—</div>
      <div class="role" id="whoDni">Asesor</div>
      <button class="btn btn-outline btn-sm logout" id="btnLogout">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Mis clientes</h1>
        <p class="sub">Registra tu cartera y da seguimiento a tus clientes recurrentes.</p>
      </div>
      <button class="btn btn-gold" id="btnNuevo">+ Nuevo cliente</button>
    </div>

    <div class="view-tabs" id="viewTabs">
      <button class="active" data-view="activos">Mis clientes</button>
      <button data-view="recurrentes">Clientes recurrentes</button>
    </div>

    <!-- ==================== VISTA: ACTIVOS ==================== -->
    <div id="viewActivos">
      <div class="panel panel-pad">
        <div class="filters">
          <div class="field search">
            <label>Buscar cliente</label>
            <input type="text" id="fBusqueda" placeholder="Nombre o celular...">
          </div>
          <div class="field">
            <label>Estado</label>
            <select id="fEstado"><option value="">Todos</option></select>
          </div>
          <div class="field">
            <label>Desde</label>
            <input type="date" id="fFechaDesde">
          </div>
          <div class="field">
            <label>Hasta</label>
            <input type="date" id="fFechaHasta">
          </div>
          <div class="field" style="flex:0;">
            <label>&nbsp;</label>
            <button class="btn btn-outline" id="btnLimpiar">Limpiar</button>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:18px;">
        <div id="tableWrapActivos">
          <div class="loading-line">Cargando clientes...</div>
        </div>
      </div>
    </div>

    <!-- ==================== VISTA: RECURRENTES ==================== -->
    <div id="viewRecurrentes" style="display:none;">
      <div class="panel panel-pad">
        <div class="filters">
          <div class="field search">
            <label>Buscar cliente o producto</label>
            <input type="text" id="fBusquedaRec" placeholder="Nombre, celular o producto...">
          </div>
          <div class="field">
            <label>Estado</label>
            <select id="fEstadoRec"><option value="">Todos</option></select>
          </div>
          <div class="field">
            <label>Desde</label>
            <input type="date" id="fFechaDesdeRec">
          </div>
          <div class="field">
            <label>Hasta</label>
            <input type="date" id="fFechaHastaRec">
          </div>
          <div class="field" style="flex:0;">
            <label>&nbsp;</label>
            <button class="btn btn-outline" id="btnLimpiarRec">Limpiar</button>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:18px;">
        <div id="tableWrapRecurrentes">
          <div class="loading-line">Cargando clientes recurrentes...</div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- Modal Nuevo / Editar cliente -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Nuevo cliente</h2>
    <form id="formCliente">
      <input type="hidden" id="clienteId">
      <div class="field">
        <label for="cNombre">Nombre del cliente</label>
        <input id="cNombre" type="text" required placeholder="Ej. Jorge Salazar">
      </div>
      <div class="field">
        <label for="cCelular">Número de celular</label>
        <input id="cCelular" type="text" inputmode="tel" required placeholder="Ej. 987654321">
      </div>
      <div class="field">
        <label for="cMonto">Monto (S/)</label>
        <input id="cMonto" type="number" step="0.01" min="0" required placeholder="Ej. 1500.00">
      </div>
      <div class="field">
        <label for="cEstado">Estado</label>
        <select id="cEstado" required></select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardar" style="width:auto;">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Productos (pasar a recurrente / agregar producto) -->
<div class="overlay" id="overlayProducto">
  <div class="modal">
    <h2 id="prodModalTitle">Productos comprados</h2>
    <p id="prodModalCliente" style="margin:-10px 0 18px;color:var(--ink-soft);font-size:13.5px;"></p>
    <form id="formProductos">
      <input type="hidden" id="prodClienteId">
      <div id="productInputs">
        <div class="product-row">
          <input type="text" class="prod-input" placeholder="Ej. Plan internet 100MB" required>
        </div>
      </div>
      <button type="button" class="add-product-link" id="btnAddProducto">+ Agregar otro producto</button>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="btnCancelarProducto">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="btnGuardarProducto" style="width:auto;">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script>
  const session = getSession();
  if (!session || session.role !== 'asesor') {
    window.location.href = 'index.html';
  }

  document.getElementById('whoNombre').textContent = session.nombre;
  document.getElementById('whoDni').textContent = 'DNI ' + session.dni;

  document.getElementById('btnLogout').addEventListener('click', ()=>{
    clearSession();
    window.location.href = 'index.html';
  });

  // ---- Poblar selects de estado ----
  const selEstadoForm = document.getElementById('cEstado');
  ESTADOS.forEach(e=>{
    document.getElementById('fEstado').insertAdjacentHTML('beforeend', `<option value="${e}">${e}</option>`);
    document.getElementById('fEstadoRec').insertAdjacentHTML('beforeend', `<option value="${e}">${e}</option>`);
    selEstadoForm.insertAdjacentHTML('beforeend', `<option value="${e}">${e}</option>`);
  });

  const estadoBgMap = {
    "EN CONVERSACION":"#EEF0F3","INTERESADO":"#FBF1DF","COTIZACION":"#FBEDE0",
    "CORDINACION DE LA VENTA":"#EFECF8","SEGIMIENTO":"#E7F3F7","VENTA":"#E4F2EC"
  };
  const estadoFgMap = {
    "EN CONVERSACION":"var(--estado-conversacion)","INTERESADO":"var(--estado-interesado)",
    "COTIZACION":"var(--estado-cotizacion)","CORDINACION DE LA VENTA":"var(--estado-coordinacion)",
    "SEGIMIENTO":"var(--estado-seguimiento)","VENTA":"var(--estado-venta)"
  };
  function estadoBg(e){ return estadoBgMap[e] || "#EEF0F3"; }
  function estadoFg(e){ return estadoFgMap[e] || "#7C8CA6"; }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function badgeHtml(estado){
    return `<span class="badge" style="background:${estadoBg(estado)};color:${estadoFg(estado)}"><span class="d" style="background:${estadoFg(estado)}"></span>${estado}</span>`;
  }

  // ---- Tabs de vista ----
  document.querySelectorAll('#viewTabs button').forEach(btn=>{
    btn.addEventListener('click', ()=> activarTab(btn.dataset.view));
  });
  function activarTab(tab){
    document.querySelectorAll('#viewTabs button').forEach(b=>b.classList.toggle('active', b.dataset.view === tab));
    document.getElementById('viewActivos').style.display = tab === 'activos' ? 'block' : 'none';
    document.getElementById('viewRecurrentes').style.display = tab === 'recurrentes' ? 'block' : 'none';
  }

  let allClientes = [];
  let productosPorCliente = {};

  async function cargarClientes(){
    document.getElementById('tableWrapActivos').innerHTML = '<div class="loading-line">Cargando clientes...</div>';
    document.getElementById('tableWrapRecurrentes').innerHTML = '<div class="loading-line">Cargando clientes recurrentes...</div>';
    try {
      allClientes = await sbGet('clientes', `?asesor_dni=eq.${encodeURIComponent(session.dni)}&order=created_at.desc&select=*`);

      const recurrentIds = allClientes.filter(c=>c.es_recurrente).map(c=>c.id);
      productosPorCliente = {};
      if (recurrentIds.length) {
        const productos = await sbGet('productos_cliente', `?cliente_id=in.(${recurrentIds.join(',')})&order=fecha.desc&select=*`);
        productos.forEach(p=>{
          if (!productosPorCliente[p.cliente_id]) productosPorCliente[p.cliente_id] = [];
          productosPorCliente[p.cliente_id].push(p);
        });
      }

      renderActivos();
      renderRecurrentes();
      renderStats();
    } catch (err) {
      const msg = '<div class="loading-line">No se pudo cargar la información. Verifica la conexión con Supabase.</div>';
      document.getElementById('tableWrapActivos').innerHTML = msg;
      document.getElementById('tableWrapRecurrentes').innerHTML = msg;
    }
  }

  function renderStats(){
    document.getElementById('statTotal').textContent = allClientes.length;
    document.getElementById('statRecurrentes').textContent = allClientes.filter(c=>c.es_recurrente).length;
    document.getElementById('statVentas').textContent = allClientes.filter(c=>c.estado === 'VENTA').length;
    const total = allClientes.reduce((sum,c)=>sum + Number(c.monto||0), 0);
    document.getElementById('statMonto').textContent = formatSoles(total);
  }

  /* ---------------- VISTA ACTIVOS ---------------- */
  function getFilteredActivos(){
    const busqueda = document.getElementById('fBusqueda').value.trim().toLowerCase();
    const estado = document.getElementById('fEstado').value;
    const desde = document.getElementById('fFechaDesde').value;
    const hasta = document.getElementById('fFechaHasta').value;

    return allClientes.filter(c=>{
      if (busqueda && !(c.nombre.toLowerCase().includes(busqueda) || c.celular.includes(busqueda))) return false;
      if (estado && c.estado !== estado) return false;
      if (desde && new Date(c.created_at) < new Date(desde)) return false;
      if (hasta && new Date(c.created_at) > new Date(hasta + 'T23:59:59')) return false;
      return true;
    });
  }

  function renderActivos(){
    const data = getFilteredActivos();
    const wrap = document.getElementById('tableWrapActivos');

    if (!data.length){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="big">Aún no hay clientes aquí</div>
          <div>Agrega tu primer cliente o ajusta los filtros de búsqueda.</div>
        </div>`;
      return;
    }

    const rows = data.map(c => `
      <tr>
        <td class="cell-nombre">${escapeHtml(c.nombre)}</td>
        <td>${escapeHtml(c.celular)}</td>
        <td class="cell-monto">${formatSoles(c.monto)}</td>
        <td>${badgeHtml(c.estado)}</td>
        <td class="cell-muted">${formatFecha(c.created_at)}</td>
        <td>
          <div class="row-actions">
            <button class="btn btn-outline btn-sm" onclick="abrirEditar('${c.id}')">Editar</button>
            ${c.es_recurrente
              ? `<span class="recurrente-tag"><span class="d"></span>Recurrente</span>`
              : `<button class="btn btn-gold btn-sm" onclick="abrirModalProducto('${c.id}', true)">Pasar a recurrentes</button>`
            }
            <button class="btn btn-danger btn-sm" onclick="eliminarCliente('${c.id}')">Eliminar</button>
          </div>
        </td>
      </tr>
    `).join('');

    wrap.innerHTML = `
      <table>
        <thead>
          <tr><th>Cliente</th><th>Celular</th><th>Monto</th><th>Estado</th><th>Registrado</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  /* ---------------- VISTA RECURRENTES ---------------- */
  function getFilteredRecurrentes(){
    const busqueda = document.getElementById('fBusquedaRec').value.trim().toLowerCase();
    const estado = document.getElementById('fEstadoRec').value;
    const desde = document.getElementById('fFechaDesdeRec').value;
    const hasta = document.getElementById('fFechaHastaRec').value;

    return allClientes.filter(c=>{
      if (!c.es_recurrente) return false;
      if (estado && c.estado !== estado) return false;
      if (desde && new Date(c.created_at) < new Date(desde)) return false;
      if (hasta && new Date(c.created_at) > new Date(hasta + 'T23:59:59')) return false;
      if (busqueda) {
        const productos = (productosPorCliente[c.id] || []).map(p=>p.producto.toLowerCase()).join(' ');
        const match = c.nombre.toLowerCase().includes(busqueda) || c.celular.includes(busqueda) || productos.includes(busqueda);
        if (!match) return false;
      }
      return true;
    });
  }

  function renderRecurrentes(){
    const data = getFilteredRecurrentes();
    const wrap = document.getElementById('tableWrapRecurrentes');

    if (!data.length){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="big">Todavía no tienes clientes recurrentes</div>
          <div>Desde "Mis clientes" usa el botón "Pasar a recurrentes" para moverlos aquí.</div>
        </div>`;
      return;
    }

    const rows = data.map(c=>{
      const productos = productosPorCliente[c.id] || [];
      const chips = productos.slice(0,3).map(p=>`<span class="product-chip">${escapeHtml(p.producto)}</span>`).join('');
      const extra = productos.length > 3 ? `<span class="product-chip more">+${productos.length - 3}</span>` : '';
      const listaProductos = productos.length ? `<div class="product-list">${chips}${extra}</div>` : `<span class="no-products">Sin productos registrados</span>`;

      return `
        <tr>
          <td class="cell-nombre">${escapeHtml(c.nombre)}</td>
          <td>${escapeHtml(c.celular)}</td>
          <td>${badgeHtml(c.estado)}</td>
          <td>${listaProductos}</td>
          <td class="cell-muted">${formatFecha(c.created_at)}</td>
          <td>
            <div class="row-actions">
              <button class="btn btn-outline btn-sm" onclick="abrirModalProducto('${c.id}', false)">+ Producto</button>
            </div>
          </td>
        </tr>`;
    }).join('');

    wrap.innerHTML = `
      <table>
        <thead>
          <tr><th>Cliente</th><th>Celular</th><th>Estado</th><th>Productos</th><th>Cliente desde</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  // Filtros activos
  ['fBusqueda','fEstado','fFechaDesde','fFechaHasta'].forEach(id=>{
    document.getElementById(id).addEventListener('input', renderActivos);
  });
  document.getElementById('btnLimpiar').addEventListener('click', ()=>{
    document.getElementById('fBusqueda').value='';
    document.getElementById('fEstado').value='';
    document.getElementById('fFechaDesde').value='';
    document.getElementById('fFechaHasta').value='';
    renderActivos();
  });

  // Filtros recurrentes
  ['fBusquedaRec','fEstadoRec','fFechaDesdeRec','fFechaHastaRec'].forEach(id=>{
    document.getElementById(id).addEventListener('input', renderRecurrentes);
  });
  document.getElementById('btnLimpiarRec').addEventListener('click', ()=>{
    document.getElementById('fBusquedaRec').value='';
    document.getElementById('fEstadoRec').value='';
    document.getElementById('fFechaDesdeRec').value='';
    document.getElementById('fFechaHastaRec').value='';
    renderRecurrentes();
  });

  /* ---------------- Modal cliente (nuevo/editar) ---------------- */
  const overlay = document.getElementById('overlay');
  const form = document.getElementById('formCliente');

  document.getElementById('btnNuevo').addEventListener('click', ()=>{
    document.getElementById('modalTitle').textContent = 'Nuevo cliente';
    form.reset();
    document.getElementById('clienteId').value = '';
    selEstadoForm.value = 'EN CONVERSACION';
    overlay.classList.add('show');
  });
  document.getElementById('btnCancelar').addEventListener('click', ()=> overlay.classList.remove('show'));
  overlay.addEventListener('click', (e)=>{ if (e.target === overlay) overlay.classList.remove('show'); });

  window.abrirEditar = function(id){
    const c = allClientes.find(x=>x.id === id);
    if (!c) return;
    document.getElementById('modalTitle').textContent = 'Editar cliente';
    document.getElementById('clienteId').value = c.id;
    document.getElementById('cNombre').value = c.nombre;
    document.getElementById('cCelular').value = c.celular;
    document.getElementById('cMonto').value = c.monto;
    selEstadoForm.value = c.estado;
    overlay.classList.add('show');
  };

  window.eliminarCliente = async function(id){
    if (!confirm('¿Eliminar este cliente de tu cartera?')) return;
    try {
      await sbDelete('clientes', `?id=eq.${id}`);
      await cargarClientes();
    } catch (err) {
      alert('No se pudo eliminar el cliente.');
    }
  };

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const id = document.getElementById('clienteId').value;
    const payload = {
      nombre: document.getElementById('cNombre').value.trim(),
      celular: document.getElementById('cCelular').value.trim(),
      monto: parseFloat(document.getElementById('cMonto').value),
      estado: selEstadoForm.value,
    };
    const btn = document.getElementById('btnGuardar');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      if (id) {
        payload.updated_at = new Date().toISOString();
        await sbPatch('clientes', `?id=eq.${id}`, payload);
      } else {
        payload.asesor_dni = session.dni;
        payload.asesor_nombre = session.nombre;
        await sbPost('clientes', payload);
      }
      overlay.classList.remove('show');
      await cargarClientes();
    } catch (err) {
      alert('No se pudo guardar el cliente.');
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  });

  /* ---------------- Modal productos (recurrente / agregar producto) ---------------- */
  const overlayProducto = document.getElementById('overlayProducto');
  const formProductos = document.getElementById('formProductos');

  window.abrirModalProducto = function(clienteId, esNuevo){
    const c = allClientes.find(x=>x.id === clienteId);
    if (!c) return;
    document.getElementById('prodModalTitle').textContent = esNuevo ? 'Pasar a clientes recurrentes' : 'Agregar producto';
    document.getElementById('prodModalCliente').textContent = `${c.nombre} · ${c.celular}`;
    document.getElementById('prodClienteId').value = clienteId;
    formProductos.dataset.nuevo = esNuevo ? '1' : '0';
    document.getElementById('productInputs').innerHTML = `
      <div class="product-row"><input type="text" class="prod-input" placeholder="Ej. Plan internet 100MB" required></div>`;
    overlayProducto.classList.add('show');
  };

  document.getElementById('btnCancelarProducto').addEventListener('click', ()=> overlayProducto.classList.remove('show'));
  overlayProducto.addEventListener('click', (e)=>{ if (e.target === overlayProducto) overlayProducto.classList.remove('show'); });

  document.getElementById('btnAddProducto').addEventListener('click', ()=>{
    const row = document.createElement('div');
    row.className = 'product-row';
    row.innerHTML = `<input type="text" class="prod-input" placeholder="Otro producto"><button type="button" class="rm" onclick="this.parentElement.remove()">&times;</button>`;
    document.getElementById('productInputs').appendChild(row);
  });

  formProductos.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const clienteId = document.getElementById('prodClienteId').value;
    const esNuevo = formProductos.dataset.nuevo === '1';
    const productos = [...document.querySelectorAll('.prod-input')].map(i=>i.value.trim()).filter(Boolean);
    if (!productos.length) return;

    const btn = document.getElementById('btnGuardarProducto');
    btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      if (esNuevo) {
        await sbPatch('clientes', `?id=eq.${clienteId}`, { es_recurrente: true });
      }
      await Promise.all(productos.map(p => sbPost('productos_cliente', { cliente_id: clienteId, producto: p })));
      overlayProducto.classList.remove('show');
      await cargarClientes();
      if (esNuevo) activarTab('recurrentes');
    } catch (err) {
      alert('No se pudo guardar la información.');
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  });

  cargarClientes();
</script>
</body>
</html>
